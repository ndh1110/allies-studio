<!DOCTYPE html>
<html>
<head>
    <title>Test BCrypt</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input, button { padding: 10px; margin: 5px; }
        #response { margin-top: 20px; border: 1px solid #ccc; padding: 10px; background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Test BCrypt Password</h1>
    <input type="text" id="username" placeholder="Username" value="user2">
    <input type="password" id="password" placeholder="Password" value="admin123">
    <button onclick="testPassword()">Test Password</button>
    <button onclick="updatePassword()">Update Password Hash</button>
    <div id="response"></div>

    <script>
        async function testPassword() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:8080/api/test/check-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                document.getElementById('response').innerHTML = 
                    `<h3>Password Check Result:</h3>
                     <pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('response').innerHTML = `Error: ${error.message}`;
            }
        }
        
        async function updatePassword() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:8080/api/test/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                document.getElementById('response').innerHTML = 
                    `<h3>Password Update Result:</h3>
                     <pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('response').innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
