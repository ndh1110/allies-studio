spring.application.name=allies-backend

# ===============================
# CẤU HÌNH SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://GiaBaoNgoHoang\\SQLEXPRESS:1433;databaseName=allies_db;encrypt=false;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=Giabao123

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT CONFIG
# ===============================
connectsphere.app.jwtSecret=mySecretKey123456789012345678901234567890123456789012345678901234567890
connectsphere.app.jwtExpirationMs=86400000

# ===============================
# WEBSOCKET CONFIG
# ===============================
spring.websocket.sockjs.enabled=true
spring.websocket.sockjs.heartbeat-time=25000
spring.websocket.sockjs.disconnect-delay=5000

# ===============================
# LOGGING CONFIG
# ===============================
logging.level.com.allies.app=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.security=DEBUG

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
server.servlet.context-path=/

# ===============================
# CORS CONFIG
# ===============================
spring.web.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true